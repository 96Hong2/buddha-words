<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
    />
    <title>부처의 말</title>

    <!-- 링크 미리보기. 카톡·트위터 크롤러는 자바스크립트를 돌리지 않아 여기 적힌 것만 읽는다.
         문구는 홈 화면에서 실제로 쓰는 말 그대로다(서비스 한 줄 · 제목).

         og:image 는 **백엔드가 준다.** 번들에 두면 두 가지가 다 틀어진다: 번들은 앱을 켤 때
         통째로 내려받는 zip 이라 화면이 안 쓰는 그림도 첫 접속 시간에 그대로 얹히고
         (이 그림 하나가 402KB 였다), 번들 주소는 토스 밖에서 400 이라 크롤러가 못 읽는다. -->
    <meta
      name="description"
      content="무슨 일이 있었나요? 편하게 이야기해 주세요. AI 가 경전을 찾아 풀어 드려요."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="부처의 말" />
    <meta property="og:title" content="부처의 말" />
    <meta
      property="og:description"
      content="무슨 일이 있었나요? 편하게 이야기해 주세요. AI 가 경전을 찾아 풀어 드려요."
    />
    <meta
      property="og:image"
      content="https://buddha-words-backend-194069970474.asia-northeast3.run.app/og/default.jpg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="연꽃 앞에 앉은 부처와 부처의 말 워드마크" />
    <meta property="og:url" content="https://buddha-words.apps.tossmini.com/" />
    <meta property="og:locale" content="ko_KR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="부처의 말" />
    <meta
      name="twitter:description"
      content="무슨 일이 있었나요? 편하게 이야기해 주세요. AI 가 경전을 찾아 풀어 드려요."
    />
    <meta
      name="twitter:image"
      content="https://buddha-words-backend-194069970474.asia-northeast3.run.app/og/default.jpg"
    />

    <!-- 글꼴은 번들 안에서 온다. 바깥 CDN 을 부르지 않는다.

         전에는 Pretendard CSS 를 cdn.jsdelivr.net 에서 **렌더를 막는 방식으로** 받고,
         마루 부리 세 굵기를 hangeul.pstatic.net 에서 받았다. 홈 화면 한 장에 외부 글꼴만
         671KB 가 내려왔고(마루부리 Bold 하나가 441KB), 그 탓에 미니앱 최초 접속이
         20초를 넘어 심사에서 반려됐다.

         지금은 둘 다 없앴다.
           · 본문(sans)은 기기 글꼴로 간다. 아래 --font-sans 스택의 Apple SD Gothic Neo(iOS)
             와 Noto Sans KR(안드로이드)이 Pretendard 와 자획 폭이 거의 같아 티가 안 난다.
           · 제목·경전(serif)만 마루 부리를 쓰되, 상용 한글 2,350자로 줄여 번들에 넣는다
             (굵기당 441KB → 약 165KB). 만드는 법은 tools/build_fonts.py.

         font-display: swap 은 그대로 둔다. 글꼴을 읽는 동안 글자를 숨기지 않는다. -->
    <style>
      @font-face {
        font-family: MaruBuri;
        font-weight: 400;
        font-style: normal;
        font-display: swap;
        src: url(/fonts/MaruBuri-Regular.subset.woff2) format('woff2');
      }
      @font-face {
        font-family: MaruBuri;
        font-weight: 700;
        font-style: normal;
        font-display: swap;
        src: url(/fonts/MaruBuri-Bold.subset.woff2) format('woff2');
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
