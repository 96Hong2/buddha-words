<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
    />
    <title>부처의 말</title>

    <!-- 링크 미리보기. 카톡·트위터 크롤러는 자바스크립트를 돌리지 않아 여기 적힌 것만 읽는다.
         문구는 홈 화면에서 실제로 쓰는 말 그대로다(서비스 한 줄 · 제목).

         og:image · twitter:image · og:url 은 절대 주소로 둔다. 상대 주소를 풀어 주지 않는
         크롤러가 있고, 그때는 미리보기가 그림 없이 글만 뜬다. 주소는 미니앱 WebView 서비스
         주소다(backend/app/core/config.py 의 CORS 목록과 같은 값). 앱 이름이 바뀌면 같이 고친다. -->
    <meta
      name="description"
      content="무슨 일이 있었나요? 편하게 이야기해 주세요. AI 가 경전을 찾아 풀어 드려요."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="부처의 말" />
    <meta property="og:title" content="부처의 말" />
    <meta
      property="og:description"
      content="무슨 일이 있었나요? 편하게 이야기해 주세요. AI 가 경전을 찾아 풀어 드려요."
    />
    <meta
      property="og:image"
      content="https://buddha-words.apps.tossmini.com/assets/og_default.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="연꽃 앞에 앉은 부처와 부처의 말 워드마크" />
    <meta property="og:url" content="https://buddha-words.apps.tossmini.com/" />
    <meta property="og:locale" content="ko_KR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="부처의 말" />
    <meta
      name="twitter:description"
      content="무슨 일이 있었나요? 편하게 이야기해 주세요. AI 가 경전을 찾아 풀어 드려요."
    />
    <meta
      name="twitter:image"
      content="https://buddha-words.apps.tossmini.com/assets/og_default.png"
    />

    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="preconnect" href="https://hangeul.pstatic.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <!-- 마루 부리(제목·경전·인용문). design/foundations/_fonts.html 의 선언을 그대로 옮긴 것이다.
         네이버가 직접 여는 웹폰트 주소에서 받는다. 남이 올려 둔 미러를 쓰면 그 저장소가 사라지는
         순간 글꼴이 통째로 빠진다(실제로 그렇게 빠져 있었다).
         네이버 공식 CSS 를 그대로 걸지 않고 @font-face 를 직접 쓰는 이유가 둘이다.
           (1) 공식 CSS 에 font-display 가 없다. 기본값은 받는 동안 글자를 숨긴다.
           (2) 공식 CSS 는 굵기마다 family 이름이 달라(MaruBuri · MaruBuriSemiBold ·
               MaruBuriBold) font-weight 가 가짜 굵기를 만든다. 한 이름에 굵기를 묶는다. -->
    <style>
      @font-face {
        font-family: 'MaruBuri';
        font-weight: 400;
        font-style: normal;
        font-display: swap;
        src: url('https://hangeul.pstatic.net/hangeul_static/webfont/MaruBuri/MaruBuri-Regular.woff2')
          format('woff2');
      }
      @font-face {
        font-family: 'MaruBuri';
        font-weight: 600;
        font-style: normal;
        font-display: swap;
        src: url('https://hangeul.pstatic.net/hangeul_static/webfont/MaruBuri/MaruBuri-SemiBold.woff2')
          format('woff2');
      }
      @font-face {
        font-family: 'MaruBuri';
        font-weight: 700;
        font-style: normal;
        font-display: swap;
        src: url('https://hangeul.pstatic.net/hangeul_static/webfont/MaruBuri/MaruBuri-Bold.woff2')
          format('woff2');
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
