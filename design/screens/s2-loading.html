<!-- @dsCard group="Screens" -->
<!-- ============================================================================
     부처의 말 · 웹폰트 비차단 로드 스니펫 v1.0
     화면 파일(design/screens/*.html, design/components/*.html)은 이 블록을
     <head> 맨 위에 그대로 복사해 붙인다. 고쳐서 쓰지 않는다.

     ■ 왜 이렇게 받나
     CSS 파일 안의 @import 는 그 시트를 다 받을 때까지 렌더를 막는다.
     10초 가계부에서 index.css 맨 위의 @import 하나가 첫 그림을 30초 막아 e2e 가
     간헐 실패했다. 미니앱은 열자마자 보여야 하는 자리라 출시 문제가 된다.
     그래서 link 를 media="print" 로 받고 onload 에서 media='all' 로 바꾼다.
     이러면 브라우저가 이 시트를 렌더 차단 자원으로 세지 않는다.

     ■ 못 받아도 읽혀야 한다
     세 폰트가 전부 실패해도 폴백 스택(Apple SD Gothic Neo, system-ui …)으로 읽힌다.
     _tokens.css 의 --font-sans · --font-serif 가 그 스택이다.

     ■ URL 확인 (2026-09-13, curl 로 실제 응답 코드를 받아 확인함)
       200  cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/.../pretendardvariable-dynamic-subset.css
       200  hangeul.pstatic.net/hangeul_static/webfont/MaruBuri/MaruBuri-{Regular,SemiBold,Bold}.woff2
       200  fonts.googleapis.com/css2?family=Noto+Serif+KR
       404  cdn.jsdelivr.net/npm/sunn-web-font@1.0.1/SUIT.css  ← 그래서 SUIT 는 받지 않는다
            SUIT 는 스택에 이름만 남긴다. 기기에 설치된 사용자만 쓰게 된다.
     ============================================================================ -->

<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://hangeul.pstatic.net" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<!-- 1) Pretendard Variable · 본문과 UI 전부.
     dynamic-subset 판이라 한글을 조각(약 34KB)으로 나눠 보내고, 브라우저는 화면에 쓴 글자가
     들어 있는 조각만 받는다. 전체 정적판(Regular 한 벌 766KB)보다 훨씬 가볍다. -->
<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css"
      media="print" onload="this.media='all'">

<!-- 2) Noto Serif KR · MaruBuri 가 실패했을 때 받는 명조 폴백.
     Google Fonts 의 css2 는 font-display:swap 을 URL 파라미터로 넣어 준다. -->
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&display=swap"
      media="print" onload="this.media='all'">

<!-- 3) MaruBuri · 제목·경전·인용문·오늘의 한마디.
     네이버가 주는 공식 CSS(hangeul.pstatic.net/hangeul_static/css/maru-buri.css)를 쓰지 않고
     아래처럼 우리가 직접 @font-face 를 쓴다. 이유가 둘이다.
       (1) 네이버 CSS 에 font-display 가 없다. 기본값 auto 는 폰트를 받는 동안 글자를 숨긴다.
           본문이 1,600자를 넘는 앱이라 그 사이 화면이 비면 크게 튄다. swap 으로 덮는다.
       (2) 네이버 CSS 는 굵기마다 family 이름이 다르다('MaruBuri', 'MaruBuriSemiBold',
           'MaruBuriBold'). 그대로 두면 font-weight:700 이 가짜 굵기(synthetic bold)를 만들어
           한글 받침이 뭉갠다. 아래에서 한 이름에 weight 를 묶어 준다.
     woff2 한 벌이 약 440KB 다. 제목과 인용문에만 쓰므로 Regular 와 Bold 두 벌만 받는다.
     실제 앱에서는 쓰는 글자만 남긴 서브셋으로 줄인다. -->
<style>
  @font-face {
    font-family: 'MaruBuri';
    font-weight: 400;
    font-style: normal;
    font-display: swap;
    src: url('https://hangeul.pstatic.net/hangeul_static/webfont/MaruBuri/MaruBuri-Regular.woff2') format('woff2');
  }
  @font-face {
    font-family: 'MaruBuri';
    font-weight: 600;
    font-style: normal;
    font-display: swap;
    src: url('https://hangeul.pstatic.net/hangeul_static/webfont/MaruBuri/MaruBuri-SemiBold.woff2') format('woff2');
  }
  @font-face {
    font-family: 'MaruBuri';
    font-weight: 700;
    font-style: normal;
    font-display: swap;
    src: url('https://hangeul.pstatic.net/hangeul_static/webfont/MaruBuri/MaruBuri-Bold.woff2') format('woff2');
  }

  /* 가짜 굵기·가짜 기울임을 끈다. 한글은 합성 굵기에서 받침이 붙어 뭉갠다. */
  html { font-synthesis-weight: none; font-synthesis-style: none; }
</style>

<title>S2 답변 생성 대기</title>

<style>
/* ============================================================================
   부처의 말 · 디자인 토큰 v1.0 (라이트 전용)
   이 파일이 색·타이포·간격의 정본이다. 화면 CSS 는 램프(--c-*)를 직접 쓰지 않고
   의미 토큰만 쓴다. 램프를 직접 쓰면 값이 바뀔 때 그 자리만 안 바뀐다.

   출처: design/assets 의 실제 이미지에서 뽑은 주조색 + 원본 HTML 의 CSS 변수.
   대비비는 전부 python3 로 WCAG 2.x 상대휘도 공식으로 계산해 통과시킨 값이다.
   기준: 본문 4.5 · 큰 글씨와 UI 경계 3.0 · 면 대 면 1.20.

   ※ 다크 팔레트는 없다. 통합 개발 계획 X1 이 라이트 전용으로 못 박았다.
     토스가 그리는 상단바가 라이트 고정이라 본문만 뒤집으면 화면 위아래가 갈라진다.
   ============================================================================ */

:root {

  /* ── 램프 (원시 토큰) ──────────────────────────────────────────────────
     에셋 이미지에서 실제로 뽑은 색을 기준으로 단계를 채웠다.
     sand 는 배경·표면·잉크가 모두 나오는 뼈대다. */

  --c-sand-50:  #FFFAF1;  /* 에셋 paper. 카드·입력칸 */
  --c-sand-100: #FBF7EF;  /* 에셋 bg. 부처 이미지 매트와 같은 톤 */
  --c-sand-150: #F6EFE2;  /* 아주 옅은 눌림 */
  --c-sand-200: #EDE4D3;  /* 앱 배경. 카드와 1.21 로 갈린다 */
  --c-sand-300: #E4D9C4;  /* 눌린 면 */
  --c-sand-400: #DCCFB8;  /* 장식 구분선 */
  --c-sand-500: #C2B096;  /* 비활성 */
  --c-sand-600: #8A7A61;  /* UI 경계. 배경 위 3.30 */
  --c-sand-700: #6B5C4E;  /* 보조 글자 */
  --c-sand-800: #4C4234;  /* 짙은 중립 면 */
  --c-sand-900: #362C25;  /* 에셋 ink. 본문 */

  --c-gold-50:  #FAF2DE;  /* 아주 옅은 금색 배경 */
  --c-gold-100: #F2E3C4;  /* 경전 인용면·금색 칩 */
  --c-gold-200: #E3C388;  /* 짙은 면 위에 놓는 금색 */
  --c-gold-300: #D3AC60;  /* 장식 */
  --c-gold-400: #B48A4A;  /* 에셋 gold 원값. 아이콘·큰 글씨 */
  --c-gold-500: #AE8340;  /* 아이콘·선. 카드 위 3.30 */
  --c-gold-600: #9E7329;  /* 경전 세로선. 경전면 위 3.35 */
  --c-gold-700: #8E6B26;  /* 포커스 링 */
  --c-gold-800: #7E5C1E;  /* 금색 글자·주의 */
  --c-gold-900: #6B4E19;  /* 금색 눌림 */

  --c-sage-50:  #EFF3EA;
  --c-sage-100: #DFE7D5;  /* 세이지 칩. 카드 위 1.22 */
  --c-sage-200: #C3D2B6;
  --c-sage-300: #9DB08D;
  --c-sage-400: #7B9169;
  --c-sage-500: #637C55;
  --c-sage-600: #4E6543;  /* 세이지 글자·성공 */
  --c-sage-700: #3D5135;
  --c-sage-800: #2F3F29;

  --c-lotus-50:  #FDF1F3;
  --c-lotus-100: #F5DBE0;  /* 연꽃 칩. 카드 위 1.26 */
  --c-lotus-200: #EDC0C8;
  --c-lotus-300: #E09FAB;  /* 에셋 연꽃잎 핑크 */
  --c-lotus-400: #CE7688;
  --c-lotus-500: #B85568;
  --c-lotus-600: #9A4356;  /* 연꽃 글자 */
  --c-lotus-700: #7D3446;

  --c-brown-700: #41382F;  /* 에셋 버튼색. 주 버튼·짙은 면 */
  --c-brown-800: #2B241D;  /* 버튼 눌림 */
  --c-red-600:   #A83C33;  /* 오류 */


  /* ── 의미 토큰 · 면 ───────────────────────────────────────────────────
     층은 두 개다. 세 번째 층을 밝기로 만들지 않는다.
     아이보리에서 세 층을 각각 1.20 으로 벌리면 셋째 층이 흙빛이 된다.
     층이 하나 더 필요하면 밝기가 아니라 --line 으로 나눈다. */

  --bg:               var(--c-sand-200);  /* 앱 배경 (층 0) */
  --surface:          var(--c-sand-50);   /* 카드·시트·입력칸 (층 1). 배경과 1.21 */
  --surface-2:        var(--c-sand-200);  /* 카드 안 인셋. 배경과 같은 톤으로 파인 자리를 만든다 */
  --surface-pressed:  var(--c-sand-300);  /* 눌림. 잠깐 보이는 상태라 1.20 요건 밖이다 */
  --surface-chip:     var(--c-sand-200);  /* 중립 칩 */
  --surface-scripture:var(--c-gold-100);  /* 경전 인용면. 카드와 1.22 */
  --surface-deep:     var(--c-brown-700); /* 오늘의 한마디 짙은 면 */
  --surface-illust:   var(--c-sand-100);  /* 부처 이미지 뒤. 이미지에 구워진 매트(#FBF8F2)와 같은 톤 */

  /* ── 의미 토큰 · 글자 ─────────────────────────────────────────────── */

  --text:          var(--c-sand-900);  /* 본문. 배경 10.78 · 카드 13.08 */
  --text-muted:    var(--c-sand-700);  /* 보조. 배경 5.09 · 카드 6.18 */
  --text-weak:     #736354;            /* 입력 안내문·비활성 라벨. 배경 4.57 · 카드 5.55 */
  --text-on-deep:  var(--c-sand-50);   /* 짙은 면 위 글자. 11.03 */
  --text-on-deep-muted: #D9CDBC;       /* 짙은 면 위 보조. 7.32 */

  /* ── 의미 토큰 · 강조 (금색) ──────────────────────────────────────────
     이 앱의 강조는 금색 하나다. 경전이 신뢰의 핵심이라 그 자리가 따로 서야 한다.
     같은 금색이라도 글자용과 면·선용의 값이 다르다. 섞어 쓰면 대비가 무너진다. */

  --accent:         var(--c-gold-500);  /* 아이콘·큰 글씨·선. 카드 위 3.30 */
  --accent-text:    var(--c-gold-800);  /* 금색 글자. 카드 5.88 · 경전면 4.82 */
  --accent-rule:    var(--c-gold-600);  /* 경전 인용면 왼쪽 세로선. 경전면 위 3.35 */
  --accent-pressed: var(--c-gold-900);  /* 금색 눌림 */
  --accent-soft:    var(--c-gold-100);  /* 금색 약배경. 칩·경전면과 같은 값 */
  --accent-on-deep: var(--c-gold-200);  /* 짙은 면 위 금색 면. 그 위 글자는 --surface-deep 6.79 */

  /* ── 의미 토큰 · 보조 색 ─────────────────────────────────────────────
     감정 태그 칩의 색만 담당한다. 색이 매번 달라지면 태그가 신호가 아니라 장식이 된다. */

  --sage:       var(--c-sage-600);   /* 세이지 글자. 세이지 칩 위 5.06 */
  --sage-soft:  var(--c-sage-100);   /* 두려움 계열 태그 칩 (#불안 #걱정) */
  --lotus:      var(--c-lotus-600);  /* 연꽃 글자. 연꽃 칩 위 4.86 */
  --lotus-soft: var(--c-lotus-100);  /* 관계·욕구 계열 태그 칩 (#집착 #인정욕구) */

  /* ── 의미 토큰 · 선 ─────────────────────────────────────────────────── */

  --line:        var(--c-sand-400);  /* 장식 구분선. 만질 수 없는 선에만 */
  --line-strong: var(--c-sand-600);  /* 입력칸·토글 등 UI 경계. 배경 3.30 · 카드 4.01 */
  --focus:       var(--c-gold-700);  /* 포커스 링. 배경 3.89 · 카드 4.72 */

  /* ── 의미 토큰 · 상태 ───────────────────────────────────────────────── */

  --success: var(--c-sage-600);  /* 저장 완료·수행 체크. 배경 5.09 */
  --caution: var(--c-gold-800);  /* 개인정보 안내 등 주의. 배경 4.84 */
  --danger:  var(--c-red-600);   /* 오류. 배경 4.95 · 카드 6.01 */

  /* ── 의미 토큰 · 버튼 ───────────────────────────────────────────────── */

  --btn:         var(--c-brown-700);  /* 주 버튼 바닥. 에셋의 버튼색 그대로 */
  --btn-pressed: var(--c-brown-800);
  --on-btn:      var(--c-sand-50);    /* 버튼 글자. 11.03 */
  --btn-ghost-line: var(--c-sand-600);/* 보조 버튼 테두리 */

  --dim: rgba(54, 44, 37, .42);  /* 바텀시트 딤 */

  /* ────────────────────────────────────────────────────────────────────
     짙은 면 사고를 막는 규칙 (10초 가계부에서 실제로 난 사고)

     원문: "월간 결산을 짙은 세이지 전면으로 바꿨더니 「다음」 버튼이 사라진 것처럼 보였다.
     버튼 바닥색이 sage-700 인데 배경도 sage-700 이라 대비가 1:1 이 됐다."

     이 앱은 「오늘의 한마디」를 --surface-deep 짙은 면으로 낸다. 그리고 --btn 이
     --surface-deep 과 **같은 값 #41382F** 이다. 아무 생각 없이 얹으면 그 사고가 그대로 난다.

     C-1  면 토큰을 바꾸는 변경은 그 면 위에 놓인 모든 요소의 토큰을 세어 보고 판정한다.
     C-2  짙은 면 위에 --btn 을 놓지 않는다. 대비 1.00 이다. 버튼이 통째로 사라진다.
     C-3  짙은 면 위에 놓을 수 있는 것은 아래 셋뿐이다.
            --text-on-deep       #FFFAF1  11.03  글자
            --text-on-deep-muted #D9CDBC   7.32  보조 글자
            --accent-on-deep     #E3C388   6.79  버튼 바닥 (그 위 글자는 --surface-deep)
     C-4  금지 조합 (계산값)
            --btn         #41382F  위  1.00  ← 사고가 나는 그 조합. 버튼이 통째로 사라진다
            --accent-text #7E5C1E  위  1.88  글자로 못 쓴다
            --text-muted  #6B5C4E  위  1.78  글자로 못 쓴다
            --accent      #AE8340  위  3.34  큰 글씨·아이콘만 된다. 본문 글자로 쓰면 4.5 미달
     C-5  새로 놓고 싶은 색이 생기면 눈이 아니라 계산으로 판정한다.
          사람 눈은 아이보리 계열에서 2단계 차이를 못 본다.
     ──────────────────────────────────────────────────────────────────── */


  /* ── 타이포 · 스택 ────────────────────────────────────────────────────
     웹폰트는 _fonts.html 이 비차단으로 받는다. CSS 안의 @import 는 금지다.
     10초 가계부에서 index.css 의 @import 가 첫 그림을 30초 막은 사고가 있었다.
     못 받아도 폴백 스택으로 읽혀야 한다. */

  --font-sans: 'Pretendard Variable', 'Pretendard', 'SUIT', 'Apple SD Gothic Neo',
               -apple-system, BlinkMacSystemFont, system-ui, 'Noto Sans KR', sans-serif;
  --font-serif: 'MaruBuri', 'Noto Serif KR', 'AppleMyungjo', 'Apple SD Gothic Neo', serif;
  --font-serif-bold: 'MaruBuriBold', 'MaruBuri', 'Noto Serif KR', 'AppleMyungjo', serif;
  --font-serif-semibold: 'MaruBuriSemiBold', 'MaruBuri', 'Noto Serif KR', 'AppleMyungjo', serif;

  /* ── 타이포 · 8단 ─────────────────────────────────────────────────────
     기준 화면 390px. 좌우 gutter 20 + 카드 padding 20 을 빼면 본문 폭 310px.
     답변 본문은 1,600~2,500자다. 이 길이를 편하게 읽히게 하는 것이 화면의 첫 목적이다.

     이름         px  행간   자간       굵기  한 줄 글자수(310px)  쓰는 곳
     display-l    28  1.42  -0.02em    700   약 11자   오늘의 한마디 (짙은 면, serif)
     display-m    22  1.55  -0.015em   600   약 14자   화면 제목·마지막 한 문장 (serif)
     title        18  1.45  -0.01em    700   약 17자   답변 섹션 제목 (sans)
     scripture    17  1.90  +0.01em    400   약 18자   경전 번역문 (serif)
     body-l       17  1.80   0         500   약 18자   답변 본문 (sans)
     body         15  1.65   0         500   약 20자   일반 본문·목록
     label        14  1.20  -0.005em   600   -         칩·버튼·탭 라벨
     caption      13  1.50   0         500   -         경전 출처·안내문

     본문을 17px 로 올린 근거:
       16px 면 한 줄 19.4자, 2,500자가 129줄 × 28px = 약 3,600px.
       17px 면 한 줄 18.2자, 2,500자가 137줄 × 30.6px = 약 4,200px.
       줄 수는 늘지만 글자가 커져 한 줄을 훑는 속도가 빨라진다. 모바일 390px 에서
       한 줄 25자 이상은 어차피 불가능하니, 줄 수를 줄이는 대신 글자를 키우는 쪽을 택했다.
     행간 1.8 근거:
       한글은 받침이 있어 라틴보다 세로로 빽빽하다. 1,600자를 넘는 글에서 1.6 은 줄이 붙어 보인다.
       1.8 은 30.6px 로, 문단 사이 간격 16px 과 겹쳐 보이지 않는 최소값이다.
     굵기 400 은 경전 번역문에만 쓴다.
       MaruBuri 는 획이 가늘어 500 이 없다. 나머지 sans 본문은 500 을 최소로 한다. */

  --t-display-l: 28px;  --lh-display-l: 1.42;  --ls-display-l: -0.02em;
  --t-display-m: 22px;  --lh-display-m: 1.55;  --ls-display-m: -0.015em;
  --t-title:     18px;  --lh-title:     1.45;  --ls-title:     -0.01em;
  --t-scripture: 17px;  --lh-scripture: 1.90;  --ls-scripture: 0.01em;
  --t-body-l:    17px;  --lh-body-l:    1.80;  --ls-body-l:    0;
  --t-body:      15px;  --lh-body:      1.65;  --ls-body:      0;
  --t-label:     14px;  --lh-label:     1.20;  --ls-label:     -0.005em;
  --t-caption:   13px;  --lh-caption:   1.50;  --ls-caption:   0;

  /* 8단 밖의 예외 하나. 광고 'Ad' 표기와 법적 고지처럼 읽히지 않아도 되는 자리만. */
  --t-micro: 11px;  --lh-micro: 1.3;

  --w-regular:  400;  /* 경전 번역문 전용 */
  --w-medium:   500;
  --w-semibold: 600;
  --w-bold:     700;

  /* ── 간격 (4의 배수) ────────────────────────────────────────────────── */

  --s-1: 4px;   --s-2: 8px;   --s-3: 12px;  --s-4: 16px;  --s-5: 20px;
  --s-6: 24px;  --s-8: 32px;  --s-10: 40px; --s-12: 48px; --s-16: 64px;

  --gutter: 20px;        /* 화면 좌우 기본 여백 */
  --pad-card: 20px;      /* 카드 안쪽 */
  --gap-card: 16px;      /* 카드와 카드 사이 */
  --gap-section: 32px;   /* 답변 섹션 사이. 구조가 있는 답변으로 읽히게 */
  --gap-para: 16px;      /* 문단 사이 */
  --tap-min: 44px;       /* 최소 터치 타깃 */

  /* ── 라운드 ──────────────────────────────────────────────────────────
     부처 이미지에는 반경 약 16px 의 둥근 모서리가 이미 구워져 있다(175px 폭 기준 실측).
     그래서 --r-image 는 그 값에 맞춘다. 더 작게 주면 구워진 아이보리 매트가 각지게 비친다. */

  --r-pill:   999px;  /* 칩·탭바·게이지 */
  --r-sheet:  24px;   /* 바텀시트 상단 */
  --r-card:   20px;   /* 카드 */
  --r-image:  16px;   /* 부처 일러스트 액자. 이미지에 구워진 반경과 같다 */
  --r-inset:  16px;   /* 경전 인용면 */
  --r-button: 14px;   /* 버튼·입력칸 */
  --r-sm:     10px;
  --r-xs:     8px;
  /* 앱 아이콘만 반경 0 이다. 콘솔 규격이 "라운드 모서리 사용 불가"다.
     우리가 둥글게 만들면 플랫폼 마스킹과 겹쳐 두 번 깎인다. */

  /* ── 그림자 ──────────────────────────────────────────────────────────
     순검정을 쓰지 않는다. 아이보리 배경 위에서 회색 그림자는 차갑게 뜬다. */

  --sh-card:   0 1px 3px rgba(54, 44, 37, .05), 0 6px 16px rgba(54, 44, 37, .04);
  --sh-raised: 0 6px 20px rgba(54, 44, 37, .10);
  --sh-tabbar: 0 4px 18px rgba(54, 44, 37, .13);
  --sh-sheet:  0 -8px 28px rgba(54, 44, 37, .14);

  /* ── 모션 ───────────────────────────────────────────────────────────── */

  --ease-out:   cubic-bezier(.22, .61, .36, 1);
  --ease-sheet: cubic-bezier(.32, .72, 0, 1);
  --dur-press: 90ms;  --dur-fade: 220ms;  --dur-section: 320ms;  --dur-sheet: 220ms;
}


/* ============================================================================
   에셋 크롭 유틸
   글자가 구워진 이미지(splash · loading · onboarding · input · empty_state · share_card)는
   그림만 쓰고 글자는 HTML 로 올린다. 아래 두 방식 중 하나를 쓴다.
   크롭 좌표는 colors.html 의 이미지 매핑표에 파일별로 적어 두었다.
   ============================================================================ */

/* 방식 1: 상자로 잘라 쓴다. 이미지 안 글자 영역을 상자 밖으로 밀어낸다.
   --iw/--ih 는 이미지 원본 크기, --cx/--cy 는 크롭 시작점, --k 는 확대 배율. */
.asset-crop {
  --k: 1;
  position: relative;
  overflow: hidden;
  background: var(--surface-illust);
  border-radius: var(--r-image);
}
.asset-crop > img {
  position: absolute;
  width: calc(var(--iw) * var(--k) * 1px);
  height: calc(var(--ih) * var(--k) * 1px);
  left: calc(var(--cx) * var(--k) * -1px);
  top: calc(var(--cy) * var(--k) * -1px);
  max-width: none;
  image-rendering: auto;
}

/* 방식 2: 그림 위에 글자를 올린다. 원본 글자 자리를 우리 배경색으로 덮고 그 위에 실제 텍스트를 놓는다.
   덮개는 반드시 불투명 구간을 포함한다. 반투명만 깔면 원본 글자가 비쳐 두 겹으로 읽힌다. */
.asset-veil { position: relative; overflow: hidden; background: var(--surface-illust); }
.asset-veil > img { display: block; width: 100%; }
.asset-veil::after {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(
    to bottom,
    var(--surface-illust) 0%,
    var(--surface-illust) var(--veil-solid, 28%),
    rgba(251, 247, 239, 0) calc(var(--veil-solid, 28%) + 12%)
  );
  pointer-events: none;
}

/* 부처 이미지는 원본이 약 175×190px 이다. 2배를 넘겨 키우면 흐려진다.
   카드 안 작은 그림·원형 마스크·블러 배경 위 원본 크기 배치로 쓴다.
   최종 앱에는 고해상도 재생성이 필요하다. */
.buddha-thumb {
  width: 128px; height: 128px;
  border-radius: var(--r-image);
  object-fit: cover; object-position: 50% 42%;
  background: var(--surface-illust);
}
.buddha-hero {
  width: 100%; max-width: 350px; aspect-ratio: 1 / 1;
  border-radius: var(--r-image);
  object-fit: cover;
  background: var(--surface-illust);
}

/* ============================================================================
   목업 장치 전용 값 (제품 토큰이 아니다)
   프레임 밖 배경·라벨·「토스가 그리는 영역」 표시에만 쓴다.
   제품 화면 안쪽은 위 의미 토큰만 쓴다.
   ============================================================================ */
:root {
  --mock-page:   #6E6E6E;
  --mock-title:  #FFFFFF;
  --mock-sub:    #E4E4E4;
  --mock-label:  #FFFFFF;
  --mock-why:    #DCDCDC;
  --mock-toss:   #DCDCDC;
  --mock-toss-t: #8C8C8C;
  --mock-shadow: 0 18px 46px rgba(0, 0, 0, .26);
}

* { box-sizing: border-box; }

/* 한글은 기본 줄바꿈이 어절을 쪼갠다(「당신 / 의 방향을」). 어절 단위로 묶는다. */
.page, .frame { word-break: keep-all; overflow-wrap: break-word; }

.page {
  margin: 0;
  padding: 40px 24px 72px;
  background: var(--mock-page);
  font-family: var(--font-sans);
  min-height: 100vh;
}

.page__title {
  margin: 0 0 8px;
  font-family: var(--font-serif);
  font-weight: var(--w-bold);
  font-size: 26px;
  letter-spacing: -0.02em;
  color: var(--mock-title);
}
.page__sub {
  margin: 0 0 40px;
  font-size: 14px;
  line-height: 1.7;
  color: var(--mock-sub);
  max-width: 860px;
}

.rail {
  display: flex;
  flex-wrap: wrap;
  gap: 40px 28px;
  align-items: flex-start;
}

.unit { margin: 0; width: 390px; }
.unit__label {
  margin: 16px 0 4px;
  font-size: 14px;
  font-weight: var(--w-bold);
  letter-spacing: -0.01em;
  color: var(--mock-label);
}
.unit__why {
  margin: 0;
  font-size: 13px;
  line-height: 1.65;
  color: var(--mock-why);
}

/* ── 기기 프레임 ───────────────────────────────────────────────────────── */

.frame {
  width: 390px;
  height: 844px;
  border-radius: 34px;
  overflow: hidden;
  background: var(--bg);
  box-shadow: var(--mock-shadow);
  display: flex;
  flex-direction: column;
  position: relative;
}
.frame--full { height: auto; }

/* 토스가 그리는 상단 영역. 우리 UI 를 여기에 넣지 않는다. */
.tossbar {
  flex: 0 0 44px;
  background: var(--mock-toss);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  letter-spacing: .06em;
  color: var(--mock-toss-t);
}

.screen {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  position: relative;
}
.frame--full .screen { overflow: visible; }

/* ── 배경 물결 띠 ───────────────────────────────────────────────────────── */

/* 가로 반복 띠. 원본이 157px 라 390px 안에서 이음매가 세 번 생긴다.
   위아래로 페이드를 걸어 이음매가 선으로 읽히지 않게 한다. */
.ripple-band {
  height: 64px;
  background-image: url('../assets/pattern_ripple.webp');
  background-repeat: repeat-x;
  background-size: auto 64px;
  background-position: center bottom;
  opacity: .42;
  flex: 0 0 auto;
  -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 62%, #000 100%);
  mask-image: linear-gradient(to bottom, transparent 0%, #000 62%, #000 100%);
}

/* ── 대기 전용 화면 (프레임 1 · 2) ──────────────────────────────────────── */

.wait {
  min-height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 var(--gutter);
}
.wait__top { flex: 0 0 40px; }
.wait__bottom { flex: 1 1 auto; min-height: 24px; }

/* 부처 액자. loading_screen.webp 에서 글자 없는 상단 영역만 잘라 쓴다.
   원본 263×529 중 (45,18)~(219,218) 을 1.15배로 본다. 2배 확대선 아래라 뭉개지지 않는다. */
.buddha-frame {
  --iw: 263; --ih: 529; --cx: 45; --cy: 18; --k: 1.15;
  width: 200px;
  height: 230px;
  background: none;
  border-radius: 0;
  -webkit-mask-image: radial-gradient(ellipse 60% 56% at 50% 46%, #000 52%, transparent 100%);
  mask-image: radial-gradient(ellipse 60% 56% at 50% 46%, #000 52%, transparent 100%);
  animation: breathe 3.2s ease-in-out infinite;
}

@keyframes breathe {
  0%, 100% { transform: scale(1); }
  50%      { transform: scale(1.04); }
}

.wait__title {
  margin: 10px 0 0;
  font-family: var(--font-serif);
  font-weight: var(--w-semibold);
  font-size: var(--t-display-m);
  line-height: var(--lh-display-m);
  letter-spacing: var(--ls-display-m);
  color: var(--text);
  text-align: center;
  animation: lineIn 7.2s var(--ease-out) infinite;
}

/* 문구가 어떻게 갈리는지 보이게, 들어오는 모션을 주기적으로 반복한다.
   실제 앱에서는 단계가 넘어가는 순간에 한 번만 돈다. */
@keyframes lineIn {
  0%   { opacity: 0; transform: translateY(6px); }
  4%   { opacity: 1; transform: translateY(0); }
  92%  { opacity: 1; transform: translateY(0); }
  100% { opacity: 0; transform: translateY(-6px); }
}

/* ── 단계 목록 ─────────────────────────────────────────────────────────── */

.steps {
  list-style: none;
  margin: 28px 0 0;
  padding: 0;
  width: 100%;
  max-width: 286px;
  position: relative;
}
.steps::before {
  content: '';
  position: absolute;
  left: 11px;
  top: 14px;
  bottom: 14px;
  width: 1px;
  background: var(--line);
}
.step {
  display: flex;
  align-items: center;
  gap: var(--s-3);
  padding: 9px 0;
  position: relative;
}
.step__dot {
  position: relative;
  flex: 0 0 23px;
  width: 23px;
  height: 23px;
  border-radius: var(--r-pill);
  background: var(--surface);
  border: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--accent-text);
}
.step__dot svg { width: 13px; height: 13px; display: block; }
.step__text {
  font-size: var(--t-body);
  line-height: var(--lh-body);
  color: var(--text-weak);
}

.step--done .step__dot { background: var(--accent-soft); border-color: var(--accent); }
.step--done .step__text { color: var(--text-muted); }

.step--now .step__dot { background: var(--surface); border-color: var(--accent); }
.step--now .step__dot::after {
  content: '';
  position: absolute;
  inset: -5px;
  border-radius: var(--r-pill);
  border: 1px solid var(--accent);
  animation: pulse 2.8s var(--ease-out) infinite;
}
.step--now .step__text { color: var(--text); font-weight: var(--w-semibold); }
.step__core {
  width: 9px; height: 9px;
  border-radius: var(--r-pill);
  background: var(--accent);
}

@keyframes pulse {
  0%   { transform: scale(.86); opacity: .9; }
  70%  { transform: scale(1.18); opacity: 0; }
  100% { transform: scale(1.18); opacity: 0; }
}

.step--todo .step__core { width: 7px; height: 7px; background: var(--line-strong); }

/* ── 하단 한 문장 ──────────────────────────────────────────────────────── */

.wait__quote {
  margin: 0 0 18px;
  font-family: var(--font-serif);
  font-size: var(--t-caption);
  line-height: 1.7;
  color: var(--text-muted);
  text-align: center;
}

/* ── 답변 상단 3블록 (프레임 3 · 4) ─────────────────────────────────────── */

.answer { padding-bottom: var(--s-6); }

.hero {
  position: relative;
  height: 200px;
  overflow: hidden;
  background: var(--surface-illust);
  display: flex;
  align-items: center;
  justify-content: center;
}
/* 원본이 175×185 라 키우면 뭉갠다. 뒤는 같은 그림을 크게 흐려 깔고,
   앞에는 원본 크기 그대로 올린다. */
.hero__blur {
  position: absolute;
  inset: -30px;
  width: calc(100% + 60px);
  height: calc(100% + 60px);
  object-fit: cover;
  filter: blur(20px);
  opacity: .55;
  transform: scale(1.1);
}
.hero__img {
  position: relative;
  width: 175px;
  height: 185px;
  border-radius: var(--r-image);
  display: block;
}

.block { padding: 0 var(--gutter); }
.block + .block { margin-top: var(--gap-card); }

.appear   { animation: appear var(--dur-section) var(--ease-out) both; }
.appear-1 { animation-delay: 40ms; }
.appear-2 { animation-delay: 100ms; }
.appear-3 { animation-delay: 180ms; }
@keyframes appear {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ① 마음 태그 */
.tags { display: flex; flex-wrap: wrap; gap: var(--s-2); margin-top: var(--s-5); }
.chip {
  padding: 6px 12px;
  border-radius: var(--r-pill);
  font-size: var(--t-label);
  line-height: var(--lh-label);
  font-weight: var(--w-semibold);
  letter-spacing: var(--ls-label);
}
/* 칩 색은 토큰이 정한 계열을 따른다. 두려움 계열은 세이지, 관계·욕구 계열은 연꽃,
   그 밖은 중립. 색이 매번 달라지면 태그가 신호가 아니라 장식이 된다. */
.chip--sage    { background: var(--sage-soft);    color: var(--sage); }
.chip--lotus   { background: var(--lotus-soft);   color: var(--lotus); }
.chip--neutral {
  background: var(--surface);
  color: var(--text-muted);
  box-shadow: inset 0 0 0 1px var(--line);
}

.tags__line {
  margin: var(--s-4) 0 0;
  font-size: var(--t-body-l);
  line-height: var(--lh-body-l);
  font-weight: var(--w-medium);
  color: var(--text);
}

/* ② 오늘의 한마디. 짙은 면 위에는 --text-on-deep · --text-on-deep-muted ·
   --accent-on-deep 셋만 올린다. --btn 은 같은 값이라 올리면 사라진다. */
.oneline {
  background: var(--surface-deep);
  border-radius: var(--r-card);
  padding: var(--pad-card);
}
.oneline__eyebrow {
  margin: 0 0 var(--s-3);
  font-size: var(--t-caption);
  line-height: var(--lh-caption);
  font-weight: var(--w-semibold);
  color: var(--text-on-deep-muted);
}
.oneline__text {
  margin: 0;
  font-family: var(--font-serif);
  font-weight: var(--w-semibold);
  font-size: var(--t-display-l);
  line-height: var(--lh-display-l);
  letter-spacing: var(--ls-display-l);
  color: var(--text-on-deep);
}
.oneline__badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  margin-top: var(--s-4);
  padding: 5px 10px;
  border-radius: var(--r-pill);
  background: var(--accent-on-deep);
  color: var(--surface-deep);
  font-size: var(--t-caption);
  font-weight: var(--w-semibold);
}
.oneline__badge svg { width: 13px; height: 13px; display: block; }

/* ③ 경전 */
.sec-head {
  display: flex;
  align-items: center;
  gap: var(--s-2);
  margin: 0 0 var(--s-3);
  font-size: var(--t-title);
  line-height: var(--lh-title);
  letter-spacing: var(--ls-title);
  font-weight: var(--w-bold);
  color: var(--text);
}
.sec-head svg { width: 19px; height: 19px; flex: 0 0 19px; color: var(--accent); display: block; }

.scripture {
  background: var(--surface-scripture);
  border-radius: var(--r-inset);
  border-left: 3px solid var(--accent-rule);
  padding: var(--s-5);
}
.scripture__text {
  margin: 0;
  font-family: var(--font-serif);
  font-weight: var(--w-regular);
  font-size: var(--t-scripture);
  line-height: var(--lh-scripture);
  letter-spacing: var(--ls-scripture);
  color: var(--text);
}

  text-align: center;

.pending__lotus {

  color: var(--accent);
  animation: breathe 3.2s ease-in-out infinite;
}
.pending__lotus svg { width: 100%; height: 100%; display: block; }

.pending__line {
  margin: 0;

}

  margin: var(--s-3) 0 0;

  line-height: var(--lh-body);
  color: var(--text-muted);
}

.dots { display: flex; justify-content: center; gap: 6px; margin-top: var(--s-4); }
.dots i {
  width: 6px; height: 6px;

  background: var(--accent);

}
.dots i:nth-child(2) { animation-delay: .22s; }
.dots i:nth-child(3) { animation-delay: .44s; }
@keyframes dot {

  35%           { opacity: 1; }

.pending .steps {

.skel span:nth-child(2) { width: 92%; }

/* 스크롤을 내린 자리. 바로 위 경전 카드가 화면 밖으로 잘려 나간 모습 */

/* ── prefers-reduced-motion ─────────────────────────────────────────────

@media (prefers-reduced-motion: reduce) {
